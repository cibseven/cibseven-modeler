<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <!-- The outline of the whole hand: every part stroked first, then all of them filled on top -->
  <g fill="#0F2133" stroke="#0F2133" stroke-width="2.5" stroke-linejoin="round">
    <rect x="6" y="10" width="12" height="11.5" rx="4"/>
    <rect x="6.5" y="4.5" width="3" height="9" rx="1.5"/>
    <rect x="9.5" y="2.5" width="3" height="10" rx="1.5"/>
    <rect x="12.5" y="3" width="3" height="10" rx="1.5"/>
    <rect x="15.5" y="5" width="3" height="8.5" rx="1.5"/>
    <rect x="2.5" y="10.5" width="3" height="7" rx="1.5" transform="rotate(-35 4 14)"/>
  </g>
  <g fill="#fff">
    <rect x="6" y="10" width="12" height="11.5" rx="4"/>
    <rect x="6.5" y="4.5" width="3" height="9" rx="1.5"/>
    <rect x="9.5" y="2.5" width="3" height="10" rx="1.5"/>
    <rect x="12.5" y="3" width="3" height="10" rx="1.5"/>
    <rect x="15.5" y="5" width="3" height="8.5" rx="1.5"/>
    <rect x="2.5" y="10.5" width="3" height="7" rx="1.5" transform="rotate(-35 4 14)"/>
  </g>
  <path d="M9.5 7v5.5M12.5 6v6.5M15.5 7v6" stroke="#0F2133" stroke-width="0.8" stroke-linecap="round"/>
</svg>
